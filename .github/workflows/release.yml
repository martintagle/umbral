# Compila el APK firmado y lo publica como Release al subir un tag v*.
#   git tag v0.1.1-beta
#   git push origin v0.1.1-beta
# Necesita los secretos del repo ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD
# (Settings → Secrets and variables → Actions). Ver docs/despliegue.md.
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  API_URL: https://umbral-api-c9ln.onrender.com/api

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      # La clave solo existe durante esta ejecución, en una carpeta temporal.
      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Faltan los secretos ANDROID_KEYSTORE_BASE64 o ANDROID_KEYSTORE_PASSWORD." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/umbral-release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/umbral-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=umbral
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release --dart-define=API_URL=$API_URL

      # Nombre fijo para que .../releases/latest/download/umbral.apk siempre sirva.
      - run: mv build/app/outputs/flutter-apk/app-release.apk umbral.apk

      - uses: softprops/action-gh-release@v2
        with:
          name: Umbral ${{ github.ref_name }}
          files: umbral.apk
          generate_release_notes: true
