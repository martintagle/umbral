<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinemáticas de Umbral</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=EB+Garamond&display=swap" rel="stylesheet">
<style>
:root{--abismo:#0d0b10;--piedra:#1c1820;--borde:#756a7c;--hueso:#e8dcc4;--ceniza:#9a8f86;--brasa:#e08a2c;--sangre:#a3242a}
*{box-sizing:border-box}body{margin:0;background:var(--abismo);color:var(--hueso);font-family:'EB Garamond',Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1040px;padding:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-family:Cinzel,serif;font-size:18px;letter-spacing:.12em;margin:0 12px 0 0;color:var(--brasa)}
button{font:inherit;background:var(--piedra);color:var(--hueso);border:1px solid var(--borde);padding:6px 12px;cursor:pointer;border-radius:4px}
button[aria-pressed=true]{border-color:var(--brasa);color:var(--brasa)}
label{display:flex;gap:6px;align-items:center;color:var(--ceniza);font-size:15px}input{font:inherit;background:var(--piedra);color:var(--hueso);border:1px solid var(--borde);padding:4px 8px;width:9em;border-radius:4px}
#pantalla{position:relative;width:min(1024px,100vw - 32px);aspect-ratio:16/9;background:#000;overflow:hidden;cursor:pointer;user-select:none}
#pantalla img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;transition:opacity .6s}
#titulo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:clamp(28px,6vw,64px);letter-spacing:.18em;text-shadow:4px 4px 0 var(--abismo);pointer-events:none}
#titulo small{font-size:.35em;color:var(--ceniza);letter-spacing:.3em;margin-top:.6em}
#caja{position:absolute;left:4%;right:4%;bottom:5%;background:rgba(13,11,16,.88);border:1px solid var(--borde);padding:14px 18px;font-size:clamp(15px,2.2vw,22px);line-height:1.35;min-height:3.2em}
#caja::after{content:'▾';position:absolute;right:10px;bottom:4px;color:var(--brasa);font-size:14px;opacity:var(--sigue,0)}
#saltar{position:absolute;top:10px;right:10px;font-size:13px;opacity:.8}
.temblor{animation:t .08s steps(2) 8}@keyframes t{0%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}100%{transform:translate(1px,2px)}}
p.nota{max-width:1040px;padding:0 16px;color:var(--ceniza);font-size:15px}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){}}
</style></head><body>
<header><h1>UMBRAL · CINEMÁTICAS</h1>
<button data-c="inicio" aria-pressed="true">Inicio</button><button data-c="final-encender">Final: La Llama</button><button data-c="final-romper">Final: El Nombre</button>
<label>Nombre <input id="nombre" value="Aldric"></label></header>
<div id="pantalla" role="button" tabindex="0" aria-label="Tocar para avanzar"><img id="img" alt=""><div id="titulo"></div><div id="caja" hidden></div><button id="saltar">Saltar</button></div>
<p class="nota">Toca o pulsa Espacio para avanzar: el primer toque completa la línea y el siguiente pasa a la próxima. Es la misma lógica que <code>CinematicaPantalla</code> del juego.</p>

GAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAMAGAsB99sgZvhIReygAAAABJRU5ErkJggg=="};
const $=s=>document.querySelector(s), img=$('#img'), caja=$('#caja'), tit=$('#titulo'), pant=$('#pantalla');
let cin,ie,it,txt,vis,reloj,relojCuadros,cuadro,fin;
function nombre(){return $('#nombre').value.trim()||'Sin Nombre'}
function empezar(id){cin=DATOS.cinematicas[id];ie=-1;siguienteEscena()}
function siguienteEscena(){ie++;clearInterval(relojCuadros);clearInterval(reloj);
 if(ie>=cin.escenas.length){caja.hidden=true;tit.innerHTML='';img.style.opacity=0;return}
 const e=cin.escenas[ie];it=-1;cuadro=0;fin=false;
 img.style.transition=e.fundido?'opacity .8s':'none';img.style.opacity=0;
 setTimeout(()=>{if(e.cuadros.length){img.src=IMGS[e.cuadros[0]];img.style.opacity=1}
  pant.classList.remove('temblor');if(e.temblor){void pant.offsetWidth;pant.classList.add('temblor')}
  relojCuadros=setInterval(()=>{if(!e.cuadros.length)return;if(cuadro<e.cuadros.length-1)cuadro++;else if(e.bucle)cuadro=0;else{fin=true;if(!e.textos.length&&!e.titulo)avanzarSolo()}img.src=IMGS[e.cuadros[cuadro]]},e.ms||1000);
  tit.innerHTML='';if(e.titulo){const t=e.titulo.replace('{nombre}',nombre());
   if(e.letraALetra){let i=0;const r=setInterval(()=>{i++;tit.textContent=t.slice(0,i);if(i>=t.length){clearInterval(r);setTimeout(()=>siguienteEscena(),1800)}},180)}
   else{tit.innerHTML=t+(e.subtitulo?'<small>'+e.subtitulo+'</small>':'')}}
  siguienteTexto()},e.fundido?350:0)}
function avanzarSolo(){clearInterval(relojCuadros);setTimeout(siguienteEscena,900)}
function siguienteTexto(){const e=cin.escenas[ie];it++;clearInterval(reloj);
 if(it>=e.textos.length){caja.hidden=true;if(!e.textos.length&&e.titulo&&!e.letraALetra){}else if(e.textos.length)siguienteEscena();return}
 txt=e.textos[it].replace('{nombre}',nombre());vis=0;caja.hidden=false;caja.style.setProperty('--sigue',0);
 reloj=setInterval(()=>{vis++;caja.textContent=txt.slice(0,vis);if(vis>=txt.length){clearInterval(reloj);caja.style.setProperty('--sigue',1)}},33)}
function tocar(){if(!cin||ie>=cin.escenas.length)return;const e=cin.escenas[ie];
 if(!caja.hidden&&vis<txt.length){clearInterval(reloj);vis=txt.length;caja.textContent=txt;caja.style.setProperty('--sigue',1);return}
 if(e.textos.length)siguienteTexto();else if(!e.letraALetra)siguienteEscena()}
pant.addEventListener('click',ev=>{if(ev.target.id!=='saltar')tocar()});
document.addEventListener('keydown',ev=>{if(ev.code==='Space'||ev.code==='Enter'){ev.preventDefault();tocar()}});
$('#saltar').onclick=()=>{ie=cin.escenas.length-1;siguienteEscena()};
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{document.querySelectorAll('header button').forEach(x=>x.setAttribute('aria-pressed',x===b));empezar(b.dataset.c)});
empezar('inicio');
</script></body></html>
