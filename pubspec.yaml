name: umbral
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: ^3.13.7

dependencies:
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/personajes/
    - assets/sprites/enemigos/
    - assets/sprites/estructuras/
    - assets/mapas/
    - assets/tiles/
    - assets/iconos/
    - assets/interiores/
    - assets/audios/
    - assets/sprites/animaciones.json
