name: umbral
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.8+9

environment:
  sdk: ^3.13.7

dependencies:
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/personajes/
    - assets/sprites/enemigos/
    - assets/sprites/estructuras/
    - assets/mapas/
    - assets/tiles/
    - assets/iconos/
    - assets/interiores/
    - assets/audios/
    - assets/hud/
    - assets/logo/
    - assets/sprites/animaciones/
    - assets/sprites/animaciones/personajes/
    - assets/sprites/animaciones/enemigos/
    - assets/minimapa/
    - assets/datos/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/icono-app-1024.png
  adaptive_icon_foreground: assets/logo/icono-android-frente-432.png
  adaptive_icon_background: assets/logo/icono-android-fondo-432.png
  remove_alpha_ios: true
